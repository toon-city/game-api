server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/toonlive}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # V6__house_json.sql dollar-quotes a JSON blob ($JSON$...$JSON$) that
    # contains many `}` — Flyway's placeholder scanner (${...}) treats the
    # `${` right after the opening $JSON$ tag as the start of a placeholder
    # and grabs everything up to the first `}` it finds as the "name",
    # failing with "No value provided for placeholder" on any truly fresh
    # database (this had never actually run before in this environment —
    # every prior local/dev postgres already had a persisted volume past
    # V6). No migration here uses real Flyway placeholders, so just turn
    # the feature off rather than escape/rewrite the JSON.
    placeholder-replacement: false

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 400ms
    livereload:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:changeme-at-least-32-chars-long!!}
    expiration-ms: 86400000   # 24h

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

# game-server-java's internal-only endpoints (real-time kick on ban).
# internal-secret must match game-server-java's own INTERNAL_SECRET env var —
# same "configure identically on both services" pattern as JWT_SECRET above.
game-server:
  internal-url: ${GAME_SERVER_INTERNAL_URL:http://localhost:8081}
  internal-secret: ${INTERNAL_SECRET:changeme-internal-secret-32-chars!!}
